[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-scanner"
version = "0.1.0"
description = "Base modular para analizar opciones financieras"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gunicorn>=22,<24"]

[tool.setuptools.packages.find]
where = ["src"]
